# pgvector server (one side of the comparison). LanceDB is embedded, so it needs no container.
# The resource limits are the measurement conditions reported in the write-up. If you change them, update the write-up too.
services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: pgvector-bench
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: >
      postgres
      -c shared_buffers=3GB
      -c maintenance_work_mem=2GB
      -c max_parallel_maintenance_workers=6
      -c max_wal_size=4GB
    shm_size: 1g
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 6g

volumes:
  pgdata:
